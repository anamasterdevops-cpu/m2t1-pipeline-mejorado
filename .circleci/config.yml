version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
      - run:
          name: Revisar el estilo con flake8
          command: |
            source venv/bin/activate
            flake8 --exclude=venv --statistics

  tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
      - run:
          name: Ejecutar los tests con cobertura
          command: |
            source venv/bin/activate
            pytest -v --cov=calculadora --cov-report=term-missing

  seguridad:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
      - run:
          name: Analizar la seguridad del código con bandit
          command: |
            source venv/bin/activate
            bandit calculadora.py

workflows:
  pipeline-mejorado:
    jobs:
      - lint
      - tests:
          requires:
            - lint
      - seguridad:
          requires:
            - tests
