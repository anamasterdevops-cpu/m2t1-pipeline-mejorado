name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  docker:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir la imagen
        run: docker build -t ghcr.io/anamasterdevops-cpu/m2t1-calculadora:latest .

      - name: Probar la imagen
        run: docker run --rm ghcr.io/anamasterdevops-cpu/m2t1-calculadora:latest

      - name: Publicar la imagen
        run: docker push ghcr.io/anamasterdevops-cpu/m2t1-calculadora:latest
