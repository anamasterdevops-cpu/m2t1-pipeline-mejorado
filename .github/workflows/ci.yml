# CI con GitHub Actions (Parte B.e.i)
name: CI

# Cuándo se ejecuta: en cada push y en cada pull request a main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos del GITHUB_TOKEN en este workflow: solo leer el código
permissions:
  contents: read

jobs:
  lint:
    name: Lint (flake8 + hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: flake8
        run: flake8 . --statistics
      - name: hadolint
        # Acción de terceros fijada por su commit (SHA) para evitar cambios inesperados
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  tests:
    name: Tests y cobertura
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest con cobertura (mínimo 90 %)
        run: |
          mkdir -p informes
          pytest -v --junitxml=informes/junit.xml \
            --cov=calculadora --cov-report=term-missing \
            --cov-report=html:informes/cobertura --cov-report=markdown:informes/cobertura.md \
            --cov-fail-under=90
      - name: Resumen en la página de la ejecución
        if: always()
        run: |
          echo "## Resultado de las pruebas" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import xml.etree.ElementTree as ET; s=ET.parse('informes/junit.xml').getroot().find('testsuite'); print(f\"- Tests: {s.get('tests')} | fallos: {s.get('failures')} | errores: {s.get('errors')} | tiempo: {s.get('time')} s\")" >> "$GITHUB_STEP_SUMMARY"
          echo "## Cobertura" >> "$GITHUB_STEP_SUMMARY"
          cat informes/cobertura.md >> "$GITHUB_STEP_SUMMARY"
      - name: Subir informes como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-tests-y-cobertura
          path: informes/

  seguridad:
    name: Seguridad (bandit + pip-audit)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: bandit (SAST)
        run: bandit -r calculadora.py
      - name: pip-audit (SCA)
        run: pip-audit -r requirements-dev.txt
